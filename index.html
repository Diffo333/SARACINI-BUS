  return {
    id: r.id,
    cliente: r.cliente,
    stato: r.stato,
    totale: r.totale,
    intestazioneMezzo: r.intestazione_mezzo || '',
    righe: r.righe || [],

function testoMezzoPer(pax, bagagli) {
  const n = Number(pax) || 0;
  if (!bagagli && n <= 20) return FLOTTA[0].testo;
  const adatto = FLOTTA.find(f => !f.soloSenzaBagagli && n <= f.max);
  return (adatto || FLOTTA[FLOTTA.length - 1]).testo;
}

// Finestra oraria mostrata nella tabella x/y del giorno selezionato (6:00-24:00).
const ORE_TIMETABLE = Array.from({ length: 18 }, (_, i) => i + 6);

function orarioAFrazione(t) {
  if (!t) return null;
  const [h, m] = t.split(':').map(Number);
  return h + (m || 0) / 60;
}

// Posizione/larghezza (in %) della barra di un servizio sulla finestra ORE_TIMETABLE.
// Se manca l'ora di fine si mostra una barra di 1 ora di default (non si conosce la durata reale).
function barraOraria(s) {
  const inizio = orarioAFrazione(s.ora_inizio);
  if (inizio === null) return null;
  const min = ORE_TIMETABLE[0], max = ORE_TIMETABLE[ORE_TIMETABLE.length - 1] + 1;
  let fine = orarioAFrazione(s.ora_fine);
  if (fine === null || fine <= inizio) fine = inizio + 1;
  const inizioClamp = Math.max(min, Math.min(max, inizio));
  const fineClamp = Math.max(min, Math.min(max, fine));
  const leftPct = ((inizioClamp - min) / (max - min)) * 100;
  const widthPct = Math.max(((fineClamp - inizioClamp) / (max - min)) * 100, 2.5);
  return { leftPct, widthPct };
}

function calcolaRiga(riga, rigaPrecedente) {
  const t = TIPI_RIGA.find(x => x.id === riga.tipo);
  const busNecessari = riga.pax > 63 ? Math.ceil(riga.pax / 63) : 1;
  const rientroDaTour = !riga.pernottoFuori && !!(rigaPrecedente && rigaPrecedente.pernottoFuori);

  if (t.forfait) {
    return { forfait: true, busNecessari, rientroDaTour: false, prezzoSuggerito: t.forfait, costi: [], utile: null };
  }
  if (riga.tipo === 'romaFissa') {
    return { forfait: true, busNecessari, rientroDaTour: false, prezzoSuggerito: ORE_ROMA[riga.oreRoma], costi: [], utile: null };
  }

  const kmMaggiorati = riga.km * 1.10;
  const divisore = (!riga.bagagli && riga.pax <= 20) ? 5 : 3;
  const mezzo = (!riga.bagagli && riga.pax <= 20) ? 'Minibus' : (riga.pax > 56 ? 'Gran Turismo' : 'Bus grande');
  const utileBase = (!riga.bagagli && riga.pax <= 20) ? 300 : 400;

  const consumo = (kmMaggiorati / divisore) * 1.9;
  const autista = (riga.pernottoFuori || rientroDaTour) ? 220 : 170;
  const pedaggio = Number(riga.pedaggio) || 0;
  const fdRoma = Number(riga.fdRoma) || 0;
  const costoTotale = consumo + autista + pedaggio + fdRoma;

  const costi = [{ label: 'Consumo', amount: consumo }];
  if (pedaggio) costi.push({ label: 'Pedaggio', amount: pedaggio });
  costi.push({ label: rientroDaTour ? 'Autista (rientro da tour)' : 'Autista', amount: autista });
  if (fdRoma) costi.push({ label: 'Giro a Roma (FD)', amount: fdRoma });

  return {
    forfait: false, mezzo, busNecessari, rientroDaTour,
    consumo, autista, pedaggio, fdRoma, costoTotale, utileBase,
    prezzoSuggerito: round5(costoTotale + utileBase),
    costi,
  };
}

function deduciRimborsiAutista(righe) {
  const s = [];
  if (righe.some(r => r.pernottoFuori)) {
    s.push({ label: 'Pernottamento e colazione autista', importo: 0, nota: '' });
    s.push({ label: 'Rimborso pranzo autista', importo: 20, nota: 'al giorno' });
  }
  const tardi = righe.filter(r => {
    if (!r.oraRientro) return false;
    const h = parseInt(r.oraRientro.split(':')[0], 10);
    return !isNaN(h) && (h >= 23 || h <= 4);
  }).length;
  if (tardi > 0) s.push({ label: 'Rimborso cena autista', importo: 30, nota: tardi > 1 ? 'al giorno' : '' });
  return s;
}

// Cerca nell'elenco ZTL la voce che corrisponde a citta e giorni di permanenza
function trovaVoceZTL(citta, giorni) {
  const c = (citta || '').trim().toLowerCase();
  if (!c) return null;
  const candidate = ZTL_ITALIA.filter(z => z.label.toLowerCase().includes(c));
  if (!candidate.length) return null;

  const perGiorni = candidate.filter(z => /\d+ giorn/.test(z.label));
  if (perGiorni.length) {
    const n = Math.max(1, Number(giorni) || 1);
    const esatta = perGiorni.find(z => z.label.includes(n + ' giorn'));
    if (esatta) return esatta;
    return perGiorni[perGiorni.length - 1];
  }

  return candidate.length === 1 ? candidate[0] : candidate;
}

// ---- ANALITICHE: andamento del valore preventivato nel tempo ----
function calcolaIntervallo(preset, inizioCustom, fineCustom) {
  const oggi = new Date();
  oggi.setHours(23, 59, 59, 999);
  if (preset === 'custom') {
    const inizio = inizioCustom ? new Date(inizioCustom + 'T00:00:00') : new Date(oggi);
    const fine = fineCustom ? new Date(fineCustom + 'T23:59:59') : oggi;
    return { inizio, fine };
  }
  const giorni = Number(preset);
  const inizio = new Date(oggi);
  inizio.setDate(inizio.getDate() - (giorni - 1));
  inizio.setHours(0, 0, 0, 0);
  return { inizio, fine: oggi };
}

// Chiave del giorno secondo l'ora locale (non UTC: altrimenti in estate, con l'Italia
// avanti di 2 ore, la mezzanotte locale finisce registrata come il giorno prima).
function chiaveGiornoLocale(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const giorno = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + giorno;
}

// Tutti i giorni coperti da un servizio (dal data_inizio al data_fine incluso): un tour di
// piu' giorni occupa mezzo/autista ogni giorno, non solo il primo, quindi deve comparire
// su ognuno di quei giorni nel calendario.
function elencoGiorniServizio(s) {
  if (!s.data_inizio) return [];
  const giorni = [];
  const inizio = new Date(s.data_inizio + 'T00:00:00');
  const fine = s.data_fine ? new Date(s.data_fine + 'T00:00:00') : inizio;
  const cursore = new Date(inizio);
  let contatore = 0;
  while (cursore <= fine && contatore < 60) {
    giorni.push(chiaveGiornoLocale(cursore));
    cursore.setDate(cursore.getDate() + 1);
    contatore++;
  }
  return giorni;
}

// Griglia del mese per il calendario: null per le celle vuote prima del giorno 1
// (settimana che inizia di lunedi', come da convenzione italiana).
function generaGrigliaMese(anno, mese) {
  const primo = new Date(anno, mese, 1);
  const giorniMese = new Date(anno, mese + 1, 0).getDate();
  const offset = (primo.getDay() + 6) % 7;
  const celle = [];
  for (let i = 0; i < offset; i++) celle.push(null);
  for (let d = 1; d <= giorniMese; d++) celle.push(new Date(anno, mese, d));
  return celle;
}

function aggregaPerGiorno(storico, inizio, fine) {
  const somme = {};
  storico.forEach(p => {
    const d = new Date(p.dataCreazione);
    if (isNaN(d) || d < inizio || d > fine) return;
    const chiave = chiaveGiornoLocale(d);
    somme[chiave] = (somme[chiave] || 0) + (Number(p.totale) || 0);
  });
  const giorni = [];
  const cursore = new Date(inizio);
  cursore.setHours(0, 0, 0, 0);
  const ultimo = new Date(fine);
  ultimo.setHours(0, 0, 0, 0);
  while (cursore <= ultimo) {
    const chiave = chiaveGiornoLocale(cursore);
    giorni.push({ data: chiave, valore: somme[chiave] || 0 });
    cursore.setDate(cursore.getDate() + 1);
  }
  return giorni;
}

function arrotondaScala(max) {
  if (max <= 0) return 100;
  const potenza = Math.pow(10, Math.floor(Math.log10(max)));
  const normalizzato = max / potenza;
  let passo;
  if (normalizzato <= 1) passo = 1;
  else if (normalizzato <= 2) passo = 2;
  else if (normalizzato <= 5) passo = 5;
  else passo = 10;
  return passo * potenza;
}

function GraficoAndamento({ punti }) {
  const [hoverX, setHoverX] = useState(null);
  const larghezza = 800, altezza = 260;
  const margine = { sopra: 16, sotto: 28, sinistra: 4, destra: 4 };
  const areaW = larghezza - margine.sinistra - margine.destra;
  const areaH = altezza - margine.sopra - margine.sotto;

  const massimo = Math.max(0, ...punti.map(p => p.valore));
  const scalaMax = arrotondaScala(massimo || 100);

  const x = i => margine.sinistra + (punti.length > 1 ? (i / (punti.length - 1)) * areaW : areaW / 2);
  const y = v => margine.sopra + areaH - (v / scalaMax) * areaH;

  const linea = punti.map((p, i) => (i === 0 ? 'M' : 'L') + x(i) + ',' + y(p.valore)).join(' ');
  const area = punti.length
    ? linea + ' L' + x(punti.length - 1) + ',' + (margine.sopra + areaH) + ' L' + x(0) + ',' + (margine.sopra + areaH) + ' Z'
    : '';

  const passiY = [0, 0.25, 0.5, 0.75, 1].map(f => scalaMax * f);
  const passoLabel = Math.max(1, Math.ceil(punti.length / 6));

  // Il punto agganciato (per pallino e tooltip) e' il giorno piu' vicino alla posizione del mouse;
  // la lineetta verticale invece segue il mouse in modo continuo, senza scattare a passi.
  const hoverIndex = hoverX === null || punti.length === 0
    ? null
    : Math.max(0, Math.min(punti.length - 1, Math.round(((hoverX - margine.sinistra) / areaW) * (punti.length - 1))));

  function formattaData(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short' });
  }

  function muovi(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    if (!rect.width || punti.length === 0) return;
    const px = ((e.clientX - rect.left) / rect.width) * larghezza;
    setHoverX(Math.max(margine.sinistra, Math.min(larghezza - margine.destra, px)));
  }

  if (!punti.length) {
    return <p className="text-sm text-slate-400 dark:text-slate-500">Nessun dato nel periodo selezionato.</p>;
  }

  return (
    <div className="relative">
      <svg viewBox={'0 0 ' + larghezza + ' ' + altezza} preserveAspectRatio="none" className="w-full" style={{ height: altezza }}
        onMouseMove={muovi} onMouseLeave={() => setHoverX(null)}>
        {passiY.map((v, i) => (
          <g key={i}>
            <line x1={margine.sinistra} x2={larghezza - margine.destra} y1={y(v)} y2={y(v)} stroke="#e1e0d9" strokeWidth="1" />
            <text x={margine.sinistra} y={y(v) - 4} fontSize="10" fill="#898781">{Math.round(v).toLocaleString('it-IT')}</text>
          </g>
        ))}
        <path d={area} fill="#C4161C" opacity="0.10" />
        <path d={linea} fill="none" stroke="#C4161C" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {punti.map((p, i) => (
          i % passoLabel === 0 && (
            <text key={'lx' + i} x={x(i)} y={altezza - 6} fontSize="10" fill="#898781" textAnchor="middle">{formattaData(p.data)}</text>
          )
        ))}
        <circle cx={x(punti.length - 1)} cy={y(punti[punti.length - 1].valore)} r="4" fill="#C4161C" stroke="#fff" strokeWidth="2" />
        {hoverIndex !== null && punti[hoverIndex] && (
          <g>
            <line x1={hoverX} x2={hoverX} y1={margine.sopra} y2={margine.sopra + areaH} stroke="#c3c2b7" strokeWidth="1" />
            <circle cx={x(hoverIndex)} cy={y(punti[hoverIndex].valore)} r="4" fill="#C4161C" stroke="#fff" strokeWidth="2" />
          </g>
        )}
      </svg>
      {hoverIndex !== null && punti[hoverIndex] && (
        <div className="absolute bg-slate-900 text-white text-xs rounded-lg px-2.5 py-1.5 pointer-events-none shadow-lg z-10"
          style={{ left: (hoverX / larghezza) * 100 + '%', top: 0, transform: 'translate(-50%, -110%)' }}>
          <div className="text-slate-300">{formattaData(punti[hoverIndex].data)}</div>
          <div className="font-medium">&euro; {fmt(punti[hoverIndex].valore)}</div>
        </div>
      )}
    </div>
  );
}

function Login() {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [errore, setErrore] = useState('');
  const [caricando, setCaricando] = useState(false);

  async function entra(e) {
    e.preventDefault();
    setErrore(''); setCaricando(true);
    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/login-con-utente', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
        body: JSON.stringify({ username: username.trim(), password }),
      });
      const dati = await response.json();
      if (!response.ok) {
        setErrore(dati.error || 'Nome utente o password non corretti.');
        setCaricando(false);
        return;
      }
      const { error } = await supabase.auth.setSession({
        access_token: dati.access_token,
        refresh_token: dati.refresh_token,
      });
      if (error) setErrore('Accesso non riuscito. Riprova.');
    } catch (e) {
      setErrore('Connessione non riuscita. Controlla internet e riprova.');
    }
    setCaricando(false);
  }

  return (
    <div className="min-h-screen bg-slate-50 dark:bg-slate-950 flex items-center justify-center p-6">
      <form onSubmit={entra} className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-6 w-full max-w-sm space-y-4">
        <div>
          <p className="text-xs font-semibold tracking-widest text-red-700 dark:text-red-400 uppercase">Saracini Bus Srl</p>
          <h1 className="text-2xl font-serif text-slate-900 dark:text-slate-100 mt-1">Accedi</h1>
        </div>
        <div>
          <label className="text-xs text-slate-500 dark:text-slate-400 mb-1 block">Nome utente</label>
          <input type="text" required value={username} onChange={e => setUsername(e.target.value)}
            className="w-full border border-slate-200 dark:border-slate-700 rounded-[10px] px-3 py-2 text-sm" />
        </div>
        <div>
          <label className="text-xs text-slate-500 dark:text-slate-400 mb-1 block">Password</label>
          <input type="password" required value={password} onChange={e => setPassword(e.target.value)}
            className="w-full border border-slate-200 dark:border-slate-700 rounded-[10px] px-3 py-2 text-sm" />
        </div>
        {errore && <p className="text-xs text-red-600 dark:text-red-400">{errore}</p>}
        <button type="submit" disabled={caricando}
          className="w-full py-2.5 rounded-lg bg-slate-900 text-white text-sm hover:bg-slate-800 disabled:opacity-50">
          {caricando ? 'Accesso...' : 'Entra'}
        </button>
      </form>
    </div>
  );
}

  async function creaServizioDaPreventivo(p) {
    if (servizi.some(s => s.preventivo_id === p.id)) return; // gia' creato, evita doppioni
    const righe = p.righe || [];
    const date = righe.map(r => r.data).filter(Boolean).sort();
    const descrizione = righe
      .map(r => [r.data, r.descrizione || (r.partenza && r.arrivo ? (r.partenza + ' - ' + r.arrivo) : '')].filter(Boolean).join(': '))
      .filter(Boolean).join('\n');
    const primaConOra = righe.find(r => r.oraPartenza);
    const ultimaConOra = [...righe].reverse().find(r => r.oraRientro);
    await cloud.creaServizio({
      preventivo_id: p.id,
      cliente: p.cliente,
      data_inizio: date[0] || null,
      data_fine: date[date.length - 1] || null,
      ora_inizio: (primaConOra && primaConOra.oraPartenza) || null,
      ora_fine: (ultimaConOra && ultimaConOra.oraRientro) || null,
      descrizione,
      mezzo: p.intestazioneMezzo || '',
      stato: 'da_assegnare',
    });
    await caricaArchivioCloud();
  }

  async function interpretaEmail() {
    if (!emailText.trim()) return;
    setAiStatus('loading');
    setAiNote('');
    try {
      const { data: { session: s } } = await supabase.auth.getSession();
      const response = await fetch(SUPABASE_URL + '/functions/v1/clever-task', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + (s ? s.access_token : ''),
          'apikey': SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ testo: emailText }),
      });
      if (!response.ok) throw new Error('http ' + response.status);
      const parsed = await response.json();

      if (parsed.clienteNome) setClienteNome(parsed.clienteNome);

      if (Array.isArray(parsed.righe) && parsed.righe.length) {
        setRighe(parsed.righe.map(r => ({
          ...nuovaRiga(r.tipo || 'km'),
          data: r.data || '',
          descrizione: r.descrizione || '',
          partenza: r.partenza || '',
          arrivo: r.arrivo || '',
          tappe: Array.isArray(r.tappe) ? r.tappe.filter(Boolean).map(t => ({ id: Math.random().toString(36).slice(2), luogo: String(t) })) : [],
          km: typeof r.km === 'number' ? r.km : 0,
          pernottoFuori: !!r.pernottoFuori,
          oreRoma: r.oreRoma || '8-9',
          oraPartenza: r.oraPartenza || '',
          oraRientro: r.oraRientro || '',
          pax: typeof parsed.pax === 'number' ? parsed.pax : 30,
        })));
      }

      // Citta riconosciute: propongo le voci ZTL corrispondenti
      if (Array.isArray(parsed.cittaZTL) && parsed.cittaZTL.length) {
        const trovate = parsed.cittaZTL.map(c => {
          const res = trovaVoceZTL(c.citta, c.giorni);
          if (!res) {
            return { citta: c.citta, ambigua: false, opzioni: [{ label: c.citta + ' ZTL', importo: 0, nota: 'non in elenco: tariffa da verificare' }] };
          }
          if (Array.isArray(res)) {
            return { citta: c.citta, ambigua: true, opzioni: res };
          }
          return { citta: c.citta, ambigua: false, opzioni: [res] };
        });
        setZtlSuggerite(trovate);
      } else {
        setZtlSuggerite([]);
      }

      setAiNote(parsed.note || 'Righe create: controlla km, mezzo e prezzi prima di inviare.');
      setAiStatus('success');
    } catch (e) {
      setAiStatus('error');
      setAiNote('Non sono riuscito a interpretare il testo. Aggiungi le righe a mano.');
    }
  }

  async function salvaPreventivo() {
    if (!clienteNome.trim()) {
      setSalvataggioMsg('Indica prima il nome del cliente.');
      setTimeout(() => setSalvataggioMsg(''), 3000);
      return;
    }
    const ora = new Date();
    const isNew = !idCorrente || !storico.some(s => s.id === idCorrente);
    const record = {
      id: idCorrente || Math.random().toString(36).slice(2),
      cliente: clienteNome.trim(),
      dataCreazione: idCorrente
        ? (storico.find(s => s.id === idCorrente) || {}).dataCreazione || ora.toISOString()
        : ora.toISOString(),
      dataModifica: ora.toISOString(),
      stato: idCorrente ? ((storico.find(s => s.id === idCorrente) || {}).stato || 'inviato') : 'inviato',
      totale,
      intestazioneMezzo,
      righe,
      vociExtra,
      nonInclude,
      testo: testoAnteprima,
    };
    const ok = await cloud.salvaPreventivo(record, isNew);
    if (!ok) {
      setSalvataggioMsg('Errore nel salvataggio: controlla la connessione e riprova.');
      setTimeout(() => setSalvataggioMsg(''), 4000);
      return;
    }
    if (isNew) {
      nuovoPreventivo();
    } else {
      setIdCorrente(record.id);
    }
    setSalvataggioMsg(isNew ? 'Preventivo salvato nello storico.' : 'Preventivo aggiornato.');
    setTimeout(() => setSalvataggioMsg(''), 3000);
    // Ricarica l'archivio (clienti, percorsi, storico...) senza far aspettare il modulo:
    // il reset qui sopra deve essere immediato, l'aggiornamento dei dati può avvenire dietro le quinte.
    caricaArchivioCloud();
  }

    const dati = {
      versione: 1,
      dataEsportazione: new Date().toISOString(),
      clienti: clientiNoti,
      percorsi: percorsiNoti,
      extra: extraNoti,
      storico: storico,
    };
    const blob = new Blob([JSON.stringify(dati, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'backup-preventivi-saracini.json';
    store.set('ultimoBackup', new Date().toISOString());
    setUltimoBackup(new Date().toISOString());
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importaTutto(file) {
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        const dati = JSON.parse(e.target.result);
        if (!dati || typeof dati !== 'object') throw new Error('formato non valido');
        const quanti = (dati.storico || []).length;
        const ok = confirm(
          'Il file contiene ' + quanti + ' preventivi, piu clienti, percorsi e ZTL.\n\n' +
          'ATTENZIONE: questo archivio e\u0027 condiviso con tutto l\u0027ufficio. Importando, questi dati si ' +
          'AGGIUNGONO (o sovrascrivono se coincidono) a quelli che vedono gia\u0027 gli altri. Procedere?'
        );
        if (!ok) return;
        setSalvataggioMsg('Importazione in corso...');
        if (Array.isArray(dati.clienti)) { for (const nome of dati.clienti) await cloud.aggiungiCliente(nome); }
        if (Array.isArray(dati.percorsi)) { for (const p of dati.percorsi) await cloud.salvaPercorso(p); }
        if (Array.isArray(dati.extra)) { for (const ex of dati.extra) await cloud.salvaExtra(ex); }
        if (Array.isArray(dati.storico)) { for (const rec of dati.storico) await cloud.salvaPreventivo(rec, true); }
        await caricaArchivioCloud();
        setSalvataggioMsg('Archivio importato: ' + quanti + ' preventivi aggiunti all\u0027archivio condiviso.');
        setTimeout(() => setSalvataggioMsg(''), 4000);
      } catch (err) {
        alert('File non valido o danneggiato. Controlla di aver scelto un backup fatto da questa app.');
      }
    };
    reader.readAsText(file);
  }

  async function salvaCliente() {
    const p = clienteNome.trim();
    if (!p) return;
    if (clientiNoti.some(c => c.toLowerCase() === p.toLowerCase())) {
      setClienteMessage('Cliente gia in archivio.');
    } else {

      else setClienteMessage('Errore nel salvataggio.');

  function aggiornaRiga(id, patch) {
    setRighe(prev => prev.map(r => r.id === id ? { ...r, ...patch } : r));
  }
  function aggiungiRiga() { setRighe(prev => [...prev, nuovaRiga('km')]); }
  function rimuoviRiga(id) { setRighe(prev => prev.filter(r => r.id !== id)); }

  function aggiungiExtra(p) {
    setVociExtra(prev => [...prev, {
      id: Math.random().toString(36).slice(2),
      label: p.label, importo: p.importo, nota: p.nota, salvata: false,
      oraria: !!p.oraria, tariffaOraria: p.oraria ? p.importo : 0, ore: p.oraria ? 1 : 0,
    }]);
  }
  function aggiornaExtra(id, patch) {
    setVociExtra(prev => prev.map(v => v.id === id ? { ...v, ...patch } : v));
  }

  // Per le voci a tariffa oraria: cambiando le ore ricalcola il totale
  function aggiornaOre(id, ore) {
    setVociExtra(prev => prev.map(v => {
      if (v.id !== id) return v;
      const n = Math.max(0, Number(ore) || 0);
      return { ...v, ore: n, importo: (Number(v.tariffaOraria) || 0) * n };
    }));
  }
  function rimuoviExtra(id) { setVociExtra(prev => prev.filter(v => v.id !== id)); }

  function completaExtra(id, label) {
    const p = (label || '').trim(); if (!p) return;
    const voce = vociExtra.find(v => v.id === id);
    const noto = extraNoti.find(e => e.label.toLowerCase() === p.toLowerCase())
              || PRESET_EXTRA.find(x => x.label.toLowerCase() === p.toLowerCase())
              || ZTL_ITALIA.find(x => x.label.toLowerCase() === p.toLowerCase());
    if (noto && voce && !Number(voce.importo)) {
      if (noto.oraria) {
        const ore = Number(voce.ore) || 1;
        aggiornaExtra(id, {
          importo: noto.importo * ore, nota: voce.nota || noto.nota || '',
          oraria: true, tariffaOraria: noto.importo, ore,
        });
      } else {
        aggiornaExtra(id, { importo: noto.importo, nota: voce.nota || noto.nota || '' });
      }
    }
  }

  async function salvaExtraInArchivio(id) {
    const v = vociExtra.find(x => x.id === id); if (!v) return;
    const p = v.label.trim(); const imp = Number(v.importo) || 0;
    if (!p || !imp) return;
    const ok = await cloud.salvaExtra({ label: p, importo: imp, nota: v.nota || '', oraria: !!v.oraria });
    if (ok) {
      setExtraNoti(prev => [...prev.filter(e => e.label.toLowerCase() !== p.toLowerCase()), { label: p, importo: imp, nota: v.nota || '' }]);
      aggiornaExtra(id, { salvata: true });
      setTimeout(() => aggiornaExtra(id, { salvata: false }), 2000);
    }
  }


  // ---- TAPPE INTERMEDIE ----
  function aggiungiTappa(rigaId) {
    setRighe(prev => prev.map(r =>
      r.id === rigaId ? { ...r, tappe: [...(r.tappe || []), { id: Math.random().toString(36).slice(2), luogo: '' }] } : r
    ));
  }

  function aggiornaTappa(rigaId, tappaId, luogo) {
    setRighe(prev => prev.map(r =>
      r.id === rigaId ? { ...r, tappe: (r.tappe || []).map(t => t.id === tappaId ? { ...t, luogo } : t) } : r
    ));
  }

  function rimuoviTappa(rigaId, tappaId) {
    setRighe(prev => prev.map(r =>
      r.id === rigaId ? { ...r, tappe: (r.tappe || []).filter(t => t.id !== tappaId) } : r
    ));
  }

  function spostaTappa(rigaId, tappaId, direzione) {
    setRighe(prev => prev.map(r => {
      if (r.id !== rigaId) return r;
      const t = [...(r.tappe || [])];
      const i = t.findIndex(x => x.id === tappaId);
      const j = i + direzione;
      if (i < 0 || j < 0 || j >= t.length) return r;
      [t[i], t[j]] = [t[j], t[i]];
      return { ...r, tappe: t };
    }));
  }

  // ---- GOOGLE MAPS: calcolo km reale ----
  function calcolaKm(riga) {
    const key = gmapsKey.trim();
    const o = riga.partenza.trim(), d = riga.arrivo.trim();
    if (!o || !d) { setKmStatus(s => ({ ...s, [riga.id]: 'Inserisci partenza e arrivo.' })); return; }
    if (!key) { setKmStatus(s => ({ ...s, [riga.id]: 'Inserisci la chiave Google in alto.' })); return; }

    setKmStatus(s => ({ ...s, [riga.id]: 'Calcolo in corso...' }));

    const tappe = (riga.tappe || []).map(t => t.luogo.trim()).filter(Boolean);

    const done = () => {
      const svc = new google.maps.DirectionsService();
      svc.route({
        origin: o,
        destination: d,
        waypoints: tappe.map(t => ({ location: t, stopover: true })),
        travelMode: 'DRIVING',
      }, (res, status) => {
        if (status !== 'OK') { setKmStatus(s => ({ ...s, [riga.id]: 'Errore Google: ' + status })); return; }
        const metri = res.routes[0].legs.reduce((tot, l) => tot + l.distance.value, 0);
        const km = Math.round(metri / 1000);
        aggiornaRiga(riga.id, { km });
        const dettaglio = tappe.length
          ? ' (giro completo con ' + tappe.length + (tappe.length === 1 ? ' tappa' : ' tappe') + ')'
          : '';
        setKmStatus(s => ({ ...s, [riga.id]: 'Trovato: ' + km + ' km' + dettaglio }));
      });
    };

    if (window.google && window.google.maps) { done(); return; }
    const sc = document.createElement('script');
    sc.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key);
    sc.onload = done;
    sc.onerror = () => setKmStatus(s => ({ ...s, [riga.id]: 'Google non raggiungibile. Controlla chiave e connessione.' }));
    document.head.appendChild(sc);
  }

  // ---- HERE: stima automatica del pedaggio ----
  async function calcolaPedaggio(riga) {
    const o = riga.partenza.trim(), d = riga.arrivo.trim();
    if (!o || !d) { setPedaggioStatus(s => ({ ...s, [riga.id]: 'Inserisci partenza e arrivo.' })); return; }
    setPedaggioStatus(s => ({ ...s, [riga.id]: 'Calcolo in corso...' }));
    try {
      const { data: { session: s } } = await supabase.auth.getSession();
      const tappe = (riga.tappe || []).map(t => t.luogo.trim()).filter(Boolean);
      const response = await fetch(SUPABASE_URL + '/functions/v1/calcola-pedaggio', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + (s ? s.access_token : ''),
          'apikey': SUPABASE_ANON_KEY,
        },
        body: JSON.stringify({ partenza: o, arrivo: d, tappe }),
      });
      const dati = await response.json();
      if (!response.ok || dati.error) {
        setPedaggioStatus(s => ({ ...s, [riga.id]: 'Errore: ' + (dati.error || 'servizio non raggiungibile.') }));
        return;
      }
      aggiornaRiga(riga.id, { pedaggio: dati.pedaggio });
      setPedaggioStatus(s => ({ ...s, [riga.id]: dati.trovatiPedaggi ? ('Trovato: € ' + dati.pedaggio) : 'Nessun pedaggio su questo percorso.' }));
    } catch (err) {
      setPedaggioStatus(s => ({ ...s, [riga.id]: 'Errore di connessione.' }));
    }
  }

  async function salvaPercorso(riga) {
    const o = riga.partenza.trim(), d = riga.arrivo.trim();
    if (!o || !d || !riga.km) return;
    const chiave = (o + '|' + d).toLowerCase();
    const ok = await cloud.salvaPercorso({ chiave, partenza: o, arrivo: d, km: riga.km });
    if (ok) {
      setPercorsiNoti(prev => [...prev.filter(p => p.chiave !== chiave), { chiave, partenza: o, arrivo: d, km: riga.km }]);
      setKmStatus(s => ({ ...s, [riga.id]: 'Percorso salvato in archivio.' }));
      setTimeout(() => setKmStatus(s => ({ ...s, [riga.id]: '' })), 2000);
    }
  }

  function cercaPercorsoNoto(riga) {
    const chiave = (riga.partenza.trim() + '|' + riga.arrivo.trim()).toLowerCase();
    const p = percorsiNoti.find(x => x.chiave === chiave);
    if (p && !riga.km) {
      aggiornaRiga(riga.id, { km: p.km });
      setKmStatus(s => ({ ...s, [riga.id]: 'Percorso gia noto: ' + p.km + ' km' }));
    }
  }

  const righeCalcolate = righe.map((r, i) => {
    const calc = calcolaRiga(r, i > 0 ? righe[i-1] : null);
    const prezzo = (r.prezzo !== null && r.prezzo !== undefined && r.prezzo !== '') ? Number(r.prezzo) : calc.prezzoSuggerito;
    const utile = calc.forfait ? null : prezzo - calc.costoTotale;
    return { riga: r, calc, prezzo, utile };
  });

  const totale = righeCalcolate.reduce((s, x) => s + (Number(x.prezzo) || 0), 0);
  const iva = totale * 0.10;
  const totaleExtra = vociExtra.reduce((s, v) => s + (Number(v.importo) || 0), 0);
  const totaleConTutto = totale + iva + totaleExtra;
  const utileComplessivo = righeCalcolate.reduce((s, x) => s + (x.utile || 0), 0);
  // Backup: e stato fatto oggi?
  const backupOggi = (() => {
    if (!ultimoBackup) return false;
    try { return new Date(ultimoBackup).toDateString() === new Date().toDateString(); }
    catch (e) { return false; }
  })();

  const maxBus = righeCalcolate.reduce((m, x) => Math.max(m, x.calc.busNecessari || 1), 1);

  // Ricerca voci: cerca in tutte le fonti, ignorando accenti e maiuscole
  const catalogoVoci = extraNoti
    .concat(PRESET_EXTRA.filter(p => !extraNoti.some(e => e.label.toLowerCase() === p.label.toLowerCase())))
    .concat(ZTL_ITALIA.filter(z => !extraNoti.some(e => e.label.toLowerCase() === z.label.toLowerCase())));

  const q = ricerca.trim().toLowerCase();
  const risultatiRicerca = q
    ? catalogoVoci.filter(v => v.label.toLowerCase().includes(q) || (v.nota || '').toLowerCase().includes(q)).slice(0, 40)
    : catalogoVoci.slice(0, 40);

  const rimborsiSuggeriti = deduciRimborsiAutista(righe)
    .filter(s => !vociExtra.some(v => v.label.toLowerCase() === s.label.toLowerCase()));

  const motivi = [];
  if (righe.some(r => r.pernottoFuori)) motivi.push("l'autista dorme fuori");
  if (righe.some(r => { const h = parseInt((r.oraRientro||'').split(':')[0],10); return !isNaN(h) && (h>=23||h<=4); })) motivi.push('si rientra dopo le 23');
  const motivoRimborsi = motivi.length ? 'Perche ' + motivi.join(' e ') + '.' : '';


  // Storico filtrato e ordinato
  const storicoFiltrato = storico
    .filter(p => filtroStato === 'tutti' || p.stato === filtroStato)
    .filter(p => {
      const q = cercaStorico.trim().toLowerCase();
      if (!q) return true;
      return (p.cliente || '').toLowerCase().includes(q)
        || (p.righe || []).some(r => ((r.descrizione || '') + ' ' + (r.arrivo || '')).toLowerCase().includes(q));
    })
    .sort((a, b) => {
      if (ordine === 'recenti') return new Date(b.dataCreazione) - new Date(a.dataCreazione);
      if (ordine === 'vecchi') return new Date(a.dataCreazione) - new Date(b.dataCreazione);
      if (ordine === 'importo') return (b.totale || 0) - (a.totale || 0);
      if (ordine === 'cliente') return (a.cliente || '').localeCompare(b.cliente || '');
      return 0;
    });

  // Mappa giorno -> servizi di quel giorno (un tour multi-giorno compare su ogni giorno che copre)
  const serviziPerGiorno = {};
  servizi.forEach(s => {
    elencoGiorniServizio(s).forEach(g => {
      (serviziPerGiorno[g] = serviziPerGiorno[g] || []).push(s);
    });
  });

  const serviziBase = giornoSelezionato ? (serviziPerGiorno[giornoSelezionato] || []) : servizi;
  const serviziFiltrati = serviziBase
    .filter(s => {
      if (filtroStatoServizi === 'tutti') return true;
      if (filtroStatoServizi === 'attivi') return s.stato !== 'svolto' && s.stato !== 'annullato';
      return s.stato === filtroStatoServizi;
    })
    .sort((a, b) => (a.data_inizio || '9999') < (b.data_inizio || '9999') ? -1 : 1);

  function cambiaMese(delta) {
    setCalendarioMese(c => {
      let mese = c.mese + delta, anno = c.anno;
      if (mese < 0) { mese = 11; anno--; }
      if (mese > 11) { mese = 0; anno++; }
      return { anno, mese };
    });
  }

  function coloreGiorno(lista) {
    if (!lista || !lista.length) return null;
    if (lista.some(s => s.stato === 'da_assegnare')) return 'bg-amber-400';
    if (lista.some(s => s.stato === 'assegnato')) return 'bg-blue-500';
    return 'bg-slate-400';
  }

  function chiaveRaggruppamento(s, tipo) {
    if (tipo === 'autista') return s.autista_id ? ((autisti.find(a => a.id === s.autista_id) || {}).nome || 'Autista') : 'Non assegnato';
    if (tipo === 'mezzo') return s.mezzo && s.mezzo.trim() ? s.mezzo.trim() : 'Mezzo non indicato';
    return s.cliente && s.cliente.trim() ? s.cliente.trim() : 'Cliente non indicato';
  }

  // Righe della tabella oraria per il giorno selezionato: una per ogni autista/mezzo/cliente
  // presente quel giorno, con dentro i suoi servizi (quelli con orario, per posizionarli sulla barra).
  const serviziGiorno = giornoSelezionato ? (serviziPerGiorno[giornoSelezionato] || []) : [];
  const serviziGiornoSenzaOra = serviziGiorno.filter(s => !s.ora_inizio);
  const gruppiTimetable = {};
  serviziGiorno.filter(s => s.ora_inizio).forEach(s => {
    const chiave = chiaveRaggruppamento(s, raggruppaTabellaOraria);
    (gruppiTimetable[chiave] = gruppiTimetable[chiave] || []).push(s);
  });
  const righeTimetable = Object.keys(gruppiTimetable).sort().map(label => ({ label, servizi: gruppiTimetable[label] }));

  const conteggi = {
    tutti: storico.length,
    inviato: storico.filter(p => p.stato === 'inviato').length,
    confermato: storico.filter(p => p.stato === 'confermato').length,
    svolto: storico.filter(p => p.stato === 'svolto').length,
  };

  const oggiSenzaOra = new Date(); oggiSenzaOra.setHours(0, 0, 0, 0);
  const scadenzeDaFare = scadenze.filter(s => !s.fatto && new Date(s.scadenza + 'T00:00:00') <= oggiSenzaOra);

  // ---- Analitiche: andamento del valore preventivato ----
  const { inizio: analInizio, fine: analFine } = calcolaIntervallo(periodoPreset, dataInizioCustom, dataFineCustom);
  const storicoPerAnalitiche = filtroStatoAnalitiche === 'tutti'
    ? storico
    : storico.filter(p => p.stato === filtroStatoAnalitiche);
  const analPunti = aggregaPerGiorno(storicoPerAnalitiche, analInizio, analFine);
  const analTotale = analPunti.reduce((s, p) => s + p.valore, 0);
  const analCount = storicoPerAnalitiche.filter(p => {
    const d = new Date(p.dataCreazione);
    return !isNaN(d) && d >= analInizio && d <= analFine;
  }).length;

  function generaTesto() {
    let out = 'Buongiorno,\nringraziandovi per la gentile richiesta, inviamo di seguito nostra quotazione:\n\n';
    out += intestazioneMezzo + '\nDISPONIBILITA DA CONFERMARE IN FASE DI PRENOTAZIONE\n';
    if (maxBus > 1) out += '\nATTENZIONE: per il numero di passeggeri indicato sono necessari ' + maxBus + ' pullman. Le quotazioni si intendono PER SINGOLO MEZZO.\n';
    out += '\n';

    righeCalcolate.forEach(({ riga, calc, prezzo }) => {
      if (riga.data) out += riga.data + '\n';
      if (riga.descrizione) out += riga.descrizione + '\n';
      if (riga.oraPartenza || riga.oraRientro) {
        const p = [];
        if (riga.oraPartenza) p.push('partenza ore ' + riga.oraPartenza);
        if (riga.oraRientro) p.push('rientro ore ' + riga.oraRientro);
        out += p.join(' - ') + '\n';
      }
      if (!calc.forfait) {
        const tp = (riga.tappe || []).map(t => t.luogo.trim()).filter(Boolean);
        if (tp.length && riga.partenza && riga.arrivo) {
          out += riga.partenza + ' - ' + tp.join(' - ') + ' - ' + riga.arrivo + '\n';
        }
        out += 'KM ' + riga.km + '\n';
        out += 'Consumo E ' + fmt(calc.consumo) + '\n';
        if (calc.pedaggio) out += 'Pedaggio E ' + fmt(calc.pedaggio) + '\n';
        out += 'Autista E ' + fmt(calc.autista) + '\n';
        if (calc.fdRoma) out += 'Giro a Roma (FD) E ' + fmt(calc.fdRoma) + '\n';
      }
      out += 'E ' + fmt(prezzo);
      if (calc.busNecessari > 1) out += ' PER SINGOLO BUS (x' + calc.busNecessari + ' mezzi)';
      out += '\n\n';
    });

    if (righeCalcolate.length > 1) {
      out += 'E ' + fmt(totale) + ' + IVA 10%';
      if (maxBus > 1) out += ' PER SINGOLO BUS (x' + maxBus + ' mezzi)';
      out += '\n\n';
    }

    out += 'NON INCLUDE:\n';
    vociExtra.forEach(v => {
      out += v.label;
      if (Number(v.importo) > 0) out += ' E ' + fmt(v.importo);
      if (v.oraria && Number(v.ore) > 0) out += ' (' + v.ore + 'h x E ' + fmt(v.tariffaOraria) + '/ora)';
      else if (v.nota) out += ' (' + v.nota + ')';
      out += '\n';
    });
    if (nonInclude.trim()) out += nonInclude.trim() + '\n';
    out += 'IVA 10%\n\n';
    out += 'Restiamo a disposizione per qualsiasi informazione o chiarimento, attendiamo risposta in caso di conferma.\n';
    out += 'In fase di finalizzazione del preventivo verra verificata la strada da percorrere e la possibilita di accesso per un bus di grandi dimensioni agli indirizzi comunicati.\n';
    out += 'Ci riserviamo pertanto di variare punto di presa e rilascio in fase di conferma.\n\n';
    out += 'Cordiali saluti.\nAlessio';
    return out.split('E ').join('\u20AC ');
  }

  // Se l'utente ha modificato l'anteprima a mano resta quella; altrimenti resta sempre
  // aggiornata in automatico man mano che si cambiano le righe del preventivo.
  const testoAnteprima = testoModificato ? testoPersonalizzato : generaTesto();

  function copiaTesto() {
    const testo = testoAnteprima;

    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = testo;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { setCopiato('ok'); }
        else { setCopiato('errore'); }
      } catch (e) {
        setCopiato('errore');
      }
      setTimeout(() => setCopiato(false), 3000);
    };

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(testo)
        .then(() => { setCopiato('ok'); setTimeout(() => setCopiato(false), 2500); })
        .catch(fallback);
    } else {
      fallback();
    }

              {idCorrente && (
                <button onClick={nuovoPreventivo}
                  className="w-full py-2 text-xs text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 underline">
                  Inizia un preventivo nuovo
                </button>
              )}

              <button onClick={copiaTesto}
                className={'w-full py-3 rounded-xl border text-sm font-medium ' +
                  (copiato === 'ok' ? 'bg-green-600 border-green-600 text-white'
                   : copiato === 'errore' ? 'bg-red-50 dark:bg-red-950 border-red-300 text-red-700 dark:text-red-400'
                   : 'bg-white dark:bg-slate-800 border-slate-300 text-slate-900 dark:text-slate-100 hover:border-slate-500')}>
                {copiato === 'ok' ? 'Copiato' : copiato === 'errore' ? 'Copia non riuscita - selezionalo sotto' : 'Copia testo email'}
              </button>

              <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-4">
                <div className="flex items-center justify-between mb-2 gap-2 flex-wrap">
                  <p className="text-xs font-medium text-slate-600 dark:text-slate-400">Anteprima email (modificabile)</p>
                  <div className="flex items-center gap-3">
                    {testoModificato && (
                      <button onClick={() => { setTestoModificato(false); setTestoPersonalizzato(''); }}
                        className="text-xs text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 underline">
                        Rigenera dai dati
                      </button>
                    )}
                    <button onClick={() => {
                        const el = document.getElementById('anteprima-testo');
                        if (!el) return;
                        el.focus(); el.select();
                      }}
                      className="text-xs text-blue-600 dark:text-blue-400 hover:text-blue-800 underline">
                      Seleziona tutto
                    </button>
                  </div>
                </div>
                <textarea id="anteprima-testo" value={testoAnteprima} rows={16}
                  onChange={e => { setTestoPersonalizzato(e.target.value); setTestoModificato(true); }}
                  className="w-full text-xs leading-relaxed text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 rounded-lg p-2 bg-slate-50 dark:bg-slate-950 resize-y" />
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-2">
                  {testoModificato
                    ? 'Modificato a mano: non cambia più da solo, nemmeno se aggiorni le righe. Usa "Rigenera dai dati" per tornare al testo automatico.'
                    : 'Puoi scriverci sopra direttamente. Finché non lo tocchi resta aggiornato in automatico con le righe del preventivo.'}
                </p>
              </div>
            </div>
          </div>
        </div>
        </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
</body>
</html>
