    stato: r.stato,

const cloud = {
  async caricaTutto() {
    const [c, p, e, s] = await Promise.all([
      supabase.from('clienti').select('nome').order('nome'),
      supabase.from('percorsi').select('chiave,partenza,arrivo,km'),
      supabase.from('extra').select('label,importo,nota,oraria'),
      supabase.from('storico').select('*').order('data_creazione', { ascending: false }),
    ]);
    return {
      clienti: (c.data || []).map(r => r.nome),
      percorsi: p.data || [],
      extra: (e.data || []).map(r => ({ label: r.label, importo: r.importo, nota: r.nota || '', oraria: r.oraria })),
      storico: (s.data || []).map(rigaStoricoDaDb),
    };
  },
  async aggiungiCliente(nome) {
    const { error } = await supabase.from('clienti').upsert({ nome }, { onConflict: 'nome', ignoreDuplicates: true });
    return !error;
  },
  async salvaPercorso(p) {
    const { error } = await supabase.from('percorsi').upsert(
      { chiave: p.chiave, partenza: p.partenza, arrivo: p.arrivo, km: p.km }, { onConflict: 'chiave' }
    );
    return !error;
  },
  async salvaExtra(e) {
    const { error } = await supabase.from('extra').upsert(
      { label: e.label, importo: e.importo, nota: e.nota || '', oraria: !!e.oraria }, { onConflict: 'label' }
    );
    return !error;
  },
  async salvaPreventivo(record, isNew) {
    const { data: { user } } = await supabase.auth.getUser();
    const row = {
      id: record.id,
      cliente: record.cliente,
      stato: record.stato,
      totale: record.totale,
      intestazione_mezzo: record.intestazioneMezzo,
      righe: record.righe,
      voci_extra: record.vociExtra,
      non_include: record.nonInclude,
      testo: record.testo,
      data_creazione: record.dataCreazione,
      data_modifica: record.dataModifica,
      modificato_da: user ? user.id : null,
    };
    if (isNew) row.creato_da = user ? user.id : null;
    const { error } = await supabase.from('storico').upsert(row, { onConflict: 'id' });
    return !error;
  },
  async cambiaStato(id, stato) {
    const { error } = await supabase.from('storico').update({ stato, data_modifica: new Date().toISOString() }).eq('id', id);
    return !error;
  },
  async elimina(id) {
    const { error } = await supabase.from('storico').delete().eq('id', id);
    return !error;
  },
};

function calcolaRiga(riga, rigaPrecedente) {
  const t = TIPI_RIGA.find(x => x.id === riga.tipo);
  const busNecessari = riga.pax > 63 ? Math.ceil(riga.pax / 63) : 1;
  const rientroDaTour = !riga.pernottoFuori && !!(rigaPrecedente && rigaPrecedente.pernottoFuori);

  if (t.forfait) {
    return { forfait: true, busNecessari, rientroDaTour: false, prezzoSuggerito: t.forfait, costi: [], utile: null };
  }
  if (riga.tipo === 'romaFissa') {
    return { forfait: true, busNecessari, rientroDaTour: false, prezzoSuggerito: ORE_ROMA[riga.oreRoma], costi: [], utile: null };
  }

  const kmMaggiorati = riga.km * 1.10;
  const divisore = (!riga.bagagli && riga.pax <= 20) ? 5 : 3;
  const mezzo = (!riga.bagagli && riga.pax <= 20) ? 'Minibus' : (riga.pax > 56 ? 'Gran Turismo' : 'Bus grande');
  const utileBase = (!riga.bagagli && riga.pax <= 20) ? 300 : 400;

  const consumo = (kmMaggiorati / divisore) * 1.9;
  const autista = (riga.pernottoFuori || rientroDaTour) ? 220 : 170;
  const pedaggio = Number(riga.pedaggio) || 0;
  const fdRoma = Number(riga.fdRoma) || 0;
  const costoTotale = consumo + autista + pedaggio + fdRoma;

  const costi = [{ label: 'Consumo', amount: consumo }];
  if (pedaggio) costi.push({ label: 'Pedaggio', amount: pedaggio });
  costi.push({ label: rientroDaTour ? 'Autista (rientro da tour)' : 'Autista', amount: autista });
  if (fdRoma) costi.push({ label: 'Giro a Roma (FD)', amount: fdRoma });

  return {
    forfait: false, mezzo, busNecessari, rientroDaTour,
    consumo, autista, pedaggio, fdRoma, costoTotale, utileBase,
    prezzoSuggerito: round5(costoTotale + utileBase),
    costi,
  };
}

function deduciRimborsiAutista(righe) {
  const s = [];
  if (righe.some(r => r.pernottoFuori)) {

  if (tardi > 0) s.push({ label: 'Rimborso cena autista', importo: 30, nota: tardi > 1 ? 'al giorno' : '' });
  return s;
}

// Cerca nell'elenco ZTL la voce che corrisponde a citta e giorni di permanenza
function trovaVoceZTL(citta, giorni) {
  const c = (citta || '').trim().toLowerCase();
  if (!c) return null;
  const candidate = ZTL_ITALIA.filter(z => z.label.toLowerCase().includes(c));
  if (!candidate.length) return null;

  const perGiorni = candidate.filter(z => /\d+ giorn/.test(z.label));
  if (perGiorni.length) {
    const n = Math.max(1, Number(giorni) || 1);
    const esatta = perGiorni.find(z => z.label.includes(n + ' giorn'));
    if (esatta) return esatta;
    return perGiorni[perGiorni.length - 1];
  }

  return candidate.length === 1 ? candidate[0] : candidate;
}

// ---- ANALITICHE: andamento del valore preventivato nel tempo ----
function calcolaIntervallo(preset, inizioCustom, fineCustom) {
  const oggi = new Date();
  oggi.setHours(23, 59, 59, 999);
  if (preset === 'custom') {
    const inizio = inizioCustom ? new Date(inizioCustom + 'T00:00:00') : new Date(oggi);
    const fine = fineCustom ? new Date(fineCustom + 'T23:59:59') : oggi;
    return { inizio, fine };
  }
  const giorni = Number(preset);
  const inizio = new Date(oggi);
  inizio.setDate(inizio.getDate() - (giorni - 1));
  inizio.setHours(0, 0, 0, 0);
  return { inizio, fine: oggi };
}

// Chiave del giorno secondo l'ora locale (non UTC: altrimenti in estate, con l'Italia
// avanti di 2 ore, la mezzanotte locale finisce registrata come il giorno prima).
function chiaveGiornoLocale(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const giorno = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + giorno;
}

function aggregaPerGiorno(storico, inizio, fine) {
  const somme = {};
  storico.forEach(p => {
    const d = new Date(p.dataCreazione);
    if (isNaN(d) || d < inizio || d > fine) return;
    const chiave = chiaveGiornoLocale(d);
    somme[chiave] = (somme[chiave] || 0) + (Number(p.totale) || 0);
  });
  const giorni = [];
  const cursore = new Date(inizio);
  cursore.setHours(0, 0, 0, 0);
  const ultimo = new Date(fine);
  ultimo.setHours(0, 0, 0, 0);
  while (cursore <= ultimo) {
    const chiave = chiaveGiornoLocale(cursore);
    giorni.push({ data: chiave, valore: somme[chiave] || 0 });
    cursore.setDate(cursore.getDate() + 1);
  }
  return giorni;
}

function arrotondaScala(max) {
  if (max <= 0) return 100;
  const potenza = Math.pow(10, Math.floor(Math.log10(max)));
  const normalizzato = max / potenza;
  let passo;
  if (normalizzato <= 1) passo = 1;
  else if (normalizzato <= 2) passo = 2;
  else if (normalizzato <= 5) passo = 5;
  else passo = 10;
  return passo * potenza;
}

function GraficoAndamento({ punti }) {
  const [hoverX, setHoverX] = useState(null);
  const larghezza = 800, altezza = 260;
  const margine = { sopra: 16, sotto: 28, sinistra: 4, destra: 4 };
  const areaW = larghezza - margine.sinistra - margine.destra;
  const areaH = altezza - margine.sopra - margine.sotto;

  const massimo = Math.max(0, ...punti.map(p => p.valore));
  const scalaMax = arrotondaScala(massimo || 100);

  const x = i => margine.sinistra + (punti.length > 1 ? (i / (punti.length - 1)) * areaW : areaW / 2);
  const y = v => margine.sopra + areaH - (v / scalaMax) * areaH;

  const linea = punti.map((p, i) => (i === 0 ? 'M' : 'L') + x(i) + ',' + y(p.valore)).join(' ');
  const area = punti.length
    ? linea + ' L' + x(punti.length - 1) + ',' + (margine.sopra + areaH) + ' L' + x(0) + ',' + (margine.sopra + areaH) + ' Z'
    : '';

  const passiY = [0, 0.25, 0.5, 0.75, 1].map(f => scalaMax * f);
  const passoLabel = Math.max(1, Math.ceil(punti.length / 6));

  // Il punto agganciato (per pallino e tooltip) e' il giorno piu' vicino alla posizione del mouse;
  // la lineetta verticale invece segue il mouse in modo continuo, senza scattare a passi.
  const hoverIndex = hoverX === null || punti.length === 0
    ? null
    : Math.max(0, Math.min(punti.length - 1, Math.round(((hoverX - margine.sinistra) / areaW) * (punti.length - 1))));

  function formattaData(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('it-IT', { day: '2-digit', month: 'short' });
  }

  function muovi(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    if (!rect.width || punti.length === 0) return;
    const px = ((e.clientX - rect.left) / rect.width) * larghezza;
    setHoverX(Math.max(margine.sinistra, Math.min(larghezza - margine.destra, px)));
  }

  if (!punti.length) {
    return <p className="text-sm text-slate-400">Nessun dato nel periodo selezionato.</p>;
  }

  return (
    <div className="relative">
      <svg viewBox={'0 0 ' + larghezza + ' ' + altezza} preserveAspectRatio="none" className="w-full" style={{ height: altezza }}
        onMouseMove={muovi} onMouseLeave={() => setHoverX(null)}>
        {passiY.map((v, i) => (
          <g key={i}>
            <line x1={margine.sinistra} x2={larghezza - margine.destra} y1={y(v)} y2={y(v)} stroke="#e1e0d9" strokeWidth="1" />
            <text x={margine.sinistra} y={y(v) - 4} fontSize="10" fill="#898781">{Math.round(v).toLocaleString('it-IT')}</text>
          </g>
        ))}
        <path d={area} fill="#C4161C" opacity="0.10" />
        <path d={linea} fill="none" stroke="#C4161C" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {punti.map((p, i) => (
          i % passoLabel === 0 && (
            <text key={'lx' + i} x={x(i)} y={altezza - 6} fontSize="10" fill="#898781" textAnchor="middle">{formattaData(p.data)}</text>
          )
        ))}
        <circle cx={x(punti.length - 1)} cy={y(punti[punti.length - 1].valore)} r="4" fill="#C4161C" stroke="#fff" strokeWidth="2" />
        {hoverIndex !== null && punti[hoverIndex] && (
          <g>
            <line x1={hoverX} x2={hoverX} y1={margine.sopra} y2={margine.sopra + areaH} stroke="#c3c2b7" strokeWidth="1" />
            <circle cx={x(hoverIndex)} cy={y(punti[hoverIndex].valore)} r="4" fill="#C4161C" stroke="#fff" strokeWidth="2" />
          </g>
        )}
      </svg>
      {hoverIndex !== null && punti[hoverIndex] && (
        <div className="absolute bg-slate-900 text-white text-xs rounded-lg px-2.5 py-1.5 pointer-events-none shadow-lg z-10"
          style={{ left: (hoverX / larghezza) * 100 + '%', top: 0, transform: 'translate(-50%, -110%)' }}>
          <div className="text-slate-300">{formattaData(punti[hoverIndex].data)}</div>
          <div className="font-medium">&euro; {fmt(punti[hoverIndex].valore)}</div>
        </div>
      )}
    </div>
  );
}

function Login() {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [errore, setErrore] = useState('');
  const [caricando, setCaricando] = useState(false);

  async function entra(e) {
    e.preventDefault();
    setErrore(''); setCaricando(true);
    try {
      const response = await fetch(SUPABASE_URL + '/functions/v1/login-con-utente', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
        body: JSON.stringify({ username: username.trim(), password }),
      });
      const dati = await response.json();
      if (!response.ok) {
        setErrore(dati.error || 'Nome utente o password non corretti.');
        setCaricando(false);
        return;
      }
      const { error } = await supabase.auth.setSession({
        access_token: dati.access_token,
        refresh_token: dati.refresh_token,
      });
      if (error) setErrore('Accesso non riuscito. Riprova.');
    } catch (e) {
      setErrore('Connessione non riuscita. Controlla internet e riprova.');
    }
    setCaricando(false);
  }

  return (
    <div className="min-h-screen bg-slate-50 flex items-center justify-center p-6">
      <form onSubmit={entra} className="bg-white border border-slate-200 rounded-xl p-6 w-full max-w-sm space-y-4">
        <div>
          <p className="text-xs font-semibold tracking-widest text-red-700 uppercase">Saracini Bus Srl</p>
          <h1 className="text-2xl font-serif text-slate-900 mt-1">Accedi</h1>
        </div>
        <div>
          <label className="text-xs text-slate-500 mb-1 block">Nome utente</label>
          <input type="text" required value={username} onChange={e => setUsername(e.target.value)}
            className="w-full border border-slate-200 rounded-[10px] px-3 py-2 text-sm" />
        </div>
        <div>
          <label className="text-xs text-slate-500 mb-1 block">Password</label>
          <input type="password" required value={password} onChange={e => setPassword(e.target.value)}
            className="w-full border border-slate-200 rounded-[10px] px-3 py-2 text-sm" />
        </div>
        {errore && <p className="text-xs text-red-600">{errore}</p>}
        <button type="submit" disabled={caricando}
          className="w-full py-2.5 rounded-lg bg-slate-900 text-white text-sm hover:bg-slate-800 disabled:opacity-50">
          {caricando ? 'Accesso...' : 'Entra'}
        </button>
      </form>
    </div>
  );
}

function Root() {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    supabase.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = supabase.auth.onAuthStateChange((_event, s) => setSession(s));

  // ---- BACKUP: esporta e importa tutto l'archivio ----
  function esportaTutto() {
    const dati = {
      versione: 1,
      dataEsportazione: new Date().toISOString(),
      clienti: clientiNoti,
      percorsi: percorsiNoti,
      extra: extraNoti,
      storico: storico,
    };
    const blob = new Blob([JSON.stringify(dati, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'backup-preventivi-saracini.json';
    store.set('ultimoBackup', new Date().toISOString());
    setUltimoBackup(new Date().toISOString());
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importaTutto(file) {
    const reader = new FileReader();
    reader.onload = async e => {
      try {
        const dati = JSON.parse(e.target.result);
        if (!dati || typeof dati !== 'object') throw new Error('formato non valido');
        const quanti = (dati.storico || []).length;
        const ok = confirm(
          'Il file contiene ' + quanti + ' preventivi, piu clienti, percorsi e ZTL.\n\n' +
          'ATTENZIONE: questo archivio e\u0027 condiviso con tutto l\u0027ufficio. Importando, questi dati si ' +
          'AGGIUNGONO (o sovrascrivono se coincidono) a quelli che vedono gia\u0027 gli altri. Procedere?'
        );
        if (!ok) return;
        setSalvataggioMsg('Importazione in corso...');
        if (Array.isArray(dati.clienti)) { for (const nome of dati.clienti) await cloud.aggiungiCliente(nome); }
        if (Array.isArray(dati.percorsi)) { for (const p of dati.percorsi) await cloud.salvaPercorso(p); }
        if (Array.isArray(dati.extra)) { for (const ex of dati.extra) await cloud.salvaExtra(ex); }
        if (Array.isArray(dati.storico)) { for (const rec of dati.storico) await cloud.salvaPreventivo(rec, true); }
        await caricaArchivioCloud();
        setSalvataggioMsg('Archivio importato: ' + quanti + ' preventivi aggiunti all\u0027archivio condiviso.');
        setTimeout(() => setSalvataggioMsg(''), 4000);
      } catch (err) {
        alert('File non valido o danneggiato. Controlla di aver scelto un backup fatto da questa app.');
      }
    };
    reader.readAsText(file);
  }

  function nuovoPreventivo() {
    setClienteNome('');
    setRighe([nuovaRiga('fcoArrivo')]);
    setVociExtra([]);
    setNonInclude('');
    setIdCorrente(null);
    setIntestazioneManuale(false);
    setVista('nuovo');
  }

  function dataIt(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });
    } catch (e) { return ''; }
  }

  async function salvaCliente() {
    const p = clienteNome.trim();
    if (!p) return;
    if (clientiNoti.some(c => c.toLowerCase() === p.toLowerCase())) {
      setClienteMessage('Cliente gia in archivio.');
    } else {
      const ok = await cloud.aggiungiCliente(p);
      if (ok) { setClientiNoti(prev => [...prev, p]); setClienteMessage('Cliente salvato.'); }
      else setClienteMessage('Errore nel salvataggio.');
    }
    setTimeout(() => setClienteMessage(''), 2500);
  }

  function aggiornaRiga(id, patch) {
    setRighe(prev => prev.map(r => r.id === id ? { ...r, ...patch } : r));
  }
  function aggiungiRiga() { setRighe(prev => [...prev, nuovaRiga('km')]); }
  function rimuoviRiga(id) { setRighe(prev => prev.filter(r => r.id !== id)); }

  function aggiungiExtra(p) {
    setVociExtra(prev => [...prev, {
      id: Math.random().toString(36).slice(2),
      label: p.label, importo: p.importo, nota: p.nota, salvata: false,
      oraria: !!p.oraria, tariffaOraria: p.oraria ? p.importo : 0, ore: p.oraria ? 1 : 0,
    }]);
  }
  function aggiornaExtra(id, patch) {
    setVociExtra(prev => prev.map(v => v.id === id ? { ...v, ...patch } : v));
  }

  // Per le voci a tariffa oraria: cambiando le ore ricalcola il totale
  function aggiornaOre(id, ore) {
    setVociExtra(prev => prev.map(v => {
      if (v.id !== id) return v;
      const n = Math.max(0, Number(ore) || 0);
      return { ...v, ore: n, importo: (Number(v.tariffaOraria) || 0) * n };
    }));
  }
  function rimuoviExtra(id) { setVociExtra(prev => prev.filter(v => v.id !== id)); }

  function completaExtra(id, label) {
    const p = (label || '').trim(); if (!p) return;
    const voce = vociExtra.find(v => v.id === id);
    const noto = extraNoti.find(e => e.label.toLowerCase() === p.toLowerCase())
              || PRESET_EXTRA.find(x => x.label.toLowerCase() === p.toLowerCase())
              || ZTL_ITALIA.find(x => x.label.toLowerCase() === p.toLowerCase());
    if (noto && voce && !Number(voce.importo)) {
      if (noto.oraria) {
        const ore = Number(voce.ore) || 1;
        aggiornaExtra(id, {
          importo: noto.importo * ore, nota: voce.nota || noto.nota || '',
          oraria: true, tariffaOraria: noto.importo, ore,
        });
      } else {
        aggiornaExtra(id, { importo: noto.importo, nota: voce.nota || noto.nota || '' });
      }
    }
  }

  async function salvaExtraInArchivio(id) {
    const v = vociExtra.find(x => x.id === id); if (!v) return;
    const p = v.label.trim(); const imp = Number(v.importo) || 0;
    if (!p || !imp) return;
    const ok = await cloud.salvaExtra({ label: p, importo: imp, nota: v.nota || '', oraria: !!v.oraria });
    if (ok) {
      setExtraNoti(prev => [...prev.filter(e => e.label.toLowerCase() !== p.toLowerCase()), { label: p, importo: imp, nota: v.nota || '' }]);
      aggiornaExtra(id, { salvata: true });
      setTimeout(() => aggiornaExtra(id, { salvata: false }), 2000);
    }
  }


  // ---- TAPPE INTERMEDIE ----
  function aggiungiTappa(rigaId) {
    setRighe(prev => prev.map(r =>
      r.id === rigaId ? { ...r, tappe: [...(r.tappe || []), { id: Math.random().toString(36).slice(2), luogo: '' }] } : r
    ));
  }

  function aggiornaTappa(rigaId, tappaId, luogo) {
    setRighe(prev => prev.map(r =>
      r.id === rigaId ? { ...r, tappe: (r.tappe || []).map(t => t.id === tappaId ? { ...t, luogo } : t) } : r
    ));
  }

  function rimuoviTappa(rigaId, tappaId) {
    setRighe(prev => prev.map(r =>
      r.id === rigaId ? { ...r, tappe: (r.tappe || []).filter(t => t.id !== tappaId) } : r
    ));
  }

  function spostaTappa(rigaId, tappaId, direzione) {
    setRighe(prev => prev.map(r => {
      if (r.id !== rigaId) return r;
      const t = [...(r.tappe || [])];
      const i = t.findIndex(x => x.id === tappaId);
      const j = i + direzione;
      if (i < 0 || j < 0 || j >= t.length) return r;
      [t[i], t[j]] = [t[j], t[i]];
      return { ...r, tappe: t };
    }));
  }

  // ---- GOOGLE MAPS: calcolo km reale ----
  function calcolaKm(riga) {
    const key = gmapsKey.trim();
    const o = riga.partenza.trim(), d = riga.arrivo.trim();
    if (!o || !d) { setKmStatus(s => ({ ...s, [riga.id]: 'Inserisci partenza e arrivo.' })); return; }
    if (!key) { setKmStatus(s => ({ ...s, [riga.id]: 'Inserisci la chiave Google in alto.' })); return; }

    setKmStatus(s => ({ ...s, [riga.id]: 'Calcolo in corso...' }));

    const tappe = (riga.tappe || []).map(t => t.luogo.trim()).filter(Boolean);

    const done = () => {
      const svc = new google.maps.DirectionsService();
      svc.route({
        origin: o,
        destination: d,
        waypoints: tappe.map(t => ({ location: t, stopover: true })),
        travelMode: 'DRIVING',
      }, (res, status) => {
        if (status !== 'OK') { setKmStatus(s => ({ ...s, [riga.id]: 'Errore Google: ' + status })); return; }
        const metri = res.routes[0].legs.reduce((tot, l) => tot + l.distance.value, 0);
        const km = Math.round(metri / 1000);
        aggiornaRiga(riga.id, { km });
        const dettaglio = tappe.length
          ? ' (giro completo con ' + tappe.length + (tappe.length === 1 ? ' tappa' : ' tappe') + ')'
          : '';
        setKmStatus(s => ({ ...s, [riga.id]: 'Trovato: ' + km + ' km' + dettaglio }));
      });
    };

    if (window.google && window.google.maps) { done(); return; }
    const sc = document.createElement('script');
    sc.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key);
    sc.onload = done;
    sc.onerror = () => setKmStatus(s => ({ ...s, [riga.id]: 'Google non raggiungibile. Controlla chiave e connessione.' }));
    document.head.appendChild(sc);
  }

  async function salvaPercorso(riga) {
    const o = riga.partenza.trim(), d = riga.arrivo.trim();
    if (!o || !d || !riga.km) return;
    const chiave = (o + '|' + d).toLowerCase();
    const ok = await cloud.salvaPercorso({ chiave, partenza: o, arrivo: d, km: riga.km });
    if (ok) {
      setPercorsiNoti(prev => [...prev.filter(p => p.chiave !== chiave), { chiave, partenza: o, arrivo: d, km: riga.km }]);
      setKmStatus(s => ({ ...s, [riga.id]: 'Percorso salvato in archivio.' }));
      setTimeout(() => setKmStatus(s => ({ ...s, [riga.id]: '' })), 2000);
    }
  }

  function cercaPercorsoNoto(riga) {
    const chiave = (riga.partenza.trim() + '|' + riga.arrivo.trim()).toLowerCase();
    const p = percorsiNoti.find(x => x.chiave === chiave);
    if (p && !riga.km) {
      aggiornaRiga(riga.id, { km: p.km });
      setKmStatus(s => ({ ...s, [riga.id]: 'Percorso gia noto: ' + p.km + ' km' }));
    }
  }

  const righeCalcolate = righe.map((r, i) => {
    const calc = calcolaRiga(r, i > 0 ? righe[i-1] : null);
    const prezzo = (r.prezzo !== null && r.prezzo !== undefined && r.prezzo !== '') ? Number(r.prezzo) : calc.prezzoSuggerito;
    const utile = calc.forfait ? null : prezzo - calc.costoTotale;
    return { riga: r, calc, prezzo, utile };
  });

  const totale = righeCalcolate.reduce((s, x) => s + (Number(x.prezzo) || 0), 0);
  const iva = totale * 0.10;
  const totaleExtra = vociExtra.reduce((s, v) => s + (Number(v.importo) || 0), 0);
  const totaleConTutto = totale + iva + totaleExtra;
  const utileComplessivo = righeCalcolate.reduce((s, x) => s + (x.utile || 0), 0);
  // Backup: e stato fatto oggi?
  const backupOggi = (() => {
    if (!ultimoBackup) return false;
    try { return new Date(ultimoBackup).toDateString() === new Date().toDateString(); }
    catch (e) { return false; }
  })();

  const maxBus = righeCalcolate.reduce((m, x) => Math.max(m, x.calc.busNecessari || 1), 1);

  // Ricerca voci: cerca in tutte le fonti, ignorando accenti e maiuscole
  const catalogoVoci = extraNoti
    .concat(PRESET_EXTRA.filter(p => !extraNoti.some(e => e.label.toLowerCase() === p.label.toLowerCase())))
    .concat(ZTL_ITALIA.filter(z => !extraNoti.some(e => e.label.toLowerCase() === z.label.toLowerCase())));

  const q = ricerca.trim().toLowerCase();
  const risultatiRicerca = q
    ? catalogoVoci.filter(v => v.label.toLowerCase().includes(q) || (v.nota || '').toLowerCase().includes(q)).slice(0, 40)
    : catalogoVoci.slice(0, 40);

  const rimborsiSuggeriti = deduciRimborsiAutista(righe)
    .filter(s => !vociExtra.some(v => v.label.toLowerCase() === s.label.toLowerCase()));

  const motivi = [];
  if (righe.some(r => r.pernottoFuori)) motivi.push("l'autista dorme fuori");
  if (righe.some(r => { const h = parseInt((r.oraRientro||'').split(':')[0],10); return !isNaN(h) && (h>=23||h<=4); })) motivi.push('si rientra dopo le 23');
  const motivoRimborsi = motivi.length ? 'Perche ' + motivi.join(' e ') + '.' : '';


  // Storico filtrato e ordinato
  const storicoFiltrato = storico
    .filter(p => filtroStato === 'tutti' || p.stato === filtroStato)
    .filter(p => {
      const q = cercaStorico.trim().toLowerCase();
      if (!q) return true;
      return (p.cliente || '').toLowerCase().includes(q)
        || (p.righe || []).some(r => ((r.descrizione || '') + ' ' + (r.arrivo || '')).toLowerCase().includes(q));
    })
    .sort((a, b) => {
      if (ordine === 'recenti') return new Date(b.dataCreazione) - new Date(a.dataCreazione);
      if (ordine === 'vecchi') return new Date(a.dataCreazione) - new Date(b.dataCreazione);
      if (ordine === 'importo') return (b.totale || 0) - (a.totale || 0);
      if (ordine === 'cliente') return (a.cliente || '').localeCompare(b.cliente || '');
      return 0;
    });

  const conteggi = {
    tutti: storico.length,
    inviato: storico.filter(p => p.stato === 'inviato').length,
    confermato: storico.filter(p => p.stato === 'confermato').length,
    svolto: storico.filter(p => p.stato === 'svolto').length,
  };

  // ---- Analitiche: andamento del valore preventivato ----
  const { inizio: analInizio, fine: analFine } = calcolaIntervallo(periodoPreset, dataInizioCustom, dataFineCustom);
  const storicoPerAnalitiche = filtroStatoAnalitiche === 'tutti'
    ? storico
    : storico.filter(p => p.stato === filtroStatoAnalitiche);
  const analPunti = aggregaPerGiorno(storicoPerAnalitiche, analInizio, analFine);
  const analTotale = analPunti.reduce((s, p) => s + p.valore, 0);
  const analCount = storicoPerAnalitiche.filter(p => {
    const d = new Date(p.dataCreazione);
    return !isNaN(d) && d >= analInizio && d <= analFine;
  }).length;

  function generaTesto() {
    let out = 'Buongiorno,\nringraziandovi per la gentile richiesta, inviamo di seguito nostra quotazione:\n\n';
    out += intestazioneMezzo + '\nDISPONIBILITA DA CONFERMARE IN FASE DI PRENOTAZIONE\n';
    if (maxBus > 1) out += '\nATTENZIONE: per il numero di passeggeri indicato sono necessari ' + maxBus + ' pullman. Le quotazioni si intendono PER SINGOLO MEZZO.\n';
    out += '\n';

    righeCalcolate.forEach(({ riga, calc, prezzo }) => {
      if (riga.data) out += riga.data + '\n';
      if (riga.descrizione) out += riga.descrizione + '\n';
      if (riga.oraPartenza || riga.oraRientro) {
        const p = [];
        if (riga.oraPartenza) p.push('partenza ore ' + riga.oraPartenza);
        if (riga.oraRientro) p.push('rientro ore ' + riga.oraRientro);
        out += p.join(' - ') + '\n';
      }
      if (!calc.forfait) {
        const tp = (riga.tappe || []).map(t => t.luogo.trim()).filter(Boolean);
        if (tp.length && riga.partenza && riga.arrivo) {
          out += riga.partenza + ' - ' + tp.join(' - ') + ' - ' + riga.arrivo + '\n';
        }
        out += 'KM ' + riga.km + '\n';
        out += 'Consumo E ' + fmt(calc.consumo) + '\n';
        if (calc.pedaggio) out += 'Pedaggio E ' + fmt(calc.pedaggio) + '\n';
        out += 'Autista E ' + fmt(calc.autista) + '\n';
        if (calc.fdRoma) out += 'Giro a Roma (FD) E ' + fmt(calc.fdRoma) + '\n';
      }
      out += 'E ' + fmt(prezzo);
      if (calc.busNecessari > 1) out += ' PER SINGOLO BUS (x' + calc.busNecessari + ' mezzi)';
      out += '\n\n';
    });

    if (righeCalcolate.length > 1) {
      out += 'E ' + fmt(totale) + ' + IVA 10%';
      if (maxBus > 1) out += ' PER SINGOLO BUS (x' + maxBus + ' mezzi)';
      out += '\n\n';
    }

    out += 'NON INCLUDE:\n';
    vociExtra.forEach(v => {
      out += v.label;
      if (Number(v.importo) > 0) out += ' E ' + fmt(v.importo);
      if (v.oraria && Number(v.ore) > 0) out += ' (' + v.ore + 'h x E ' + fmt(v.tariffaOraria) + '/ora)';
      else if (v.nota) out += ' (' + v.nota + ')';
      out += '\n';
    });
    if (nonInclude.trim()) out += nonInclude.trim() + '\n';
    out += 'IVA 10%\n\n';
    out += 'Restiamo a disposizione per qualsiasi informazione o chiarimento, attendiamo risposta in caso di conferma.\n';
    out += 'In fase di finalizzazione del preventivo verra verificata la strada da percorrere e la possibilita di accesso per un bus di grandi dimensioni agli indirizzi comunicati.\n';
    out += 'Ci riserviamo pertanto di variare punto di presa e rilascio in fase di conferma.\n\n';
    out += 'Cordiali saluti.\nAlessio';
    return out.split('E ').join('\u20AC ');
  }

  function copiaTesto() {
    const testo = generaTesto();

    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = testo;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { setCopiato('ok'); }
        else { setCopiato('errore'); }
      } catch (e) {
        setCopiato('errore');
      }
      setTimeout(() => setCopiato(false), 3000);
    };

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(testo)
        .then(() => { setCopiato('ok'); setTimeout(() => setCopiato(false), 2500); })
        .catch(fallback);
    } else {
      fallback();
    }
  }

                  {[

                        Con bagagli
                      </label>
                      <label className="flex items-center gap-2 text-sm text-slate-700">
                        <input type="checkbox" checked={riga.pernottoFuori} onChange={e => aggiornaRiga(riga.id, { pernottoFuori: e.target.checked })} />
                        Autista dorme fuori
                      </label>
                    </div>
                  </div>
                )}

                {calc.rientroDaTour && (
                  <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 text-xs text-blue-900">
                    Giorno di rientro da un tour: autista a <strong>&euro;220</strong>, perche ha dormito fuori la notte precedente.
                  </div>
                )}

                {riga.fdRoma > 0 && (
                  <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 space-y-2">
                    <p className="text-xs text-amber-900">Giri a Roma dopo un tour o transfer: aggiunta la tariffa FD. Modificala secondo le ore.</p>
                    <div className="flex items-center gap-2 flex-wrap">
                      {[550,580,620].map(v => (
                        <button key={v} onClick={() => aggiornaRiga(riga.id, { fdRoma: v })}
                          className={'px-2.5 py-1 rounded-lg border text-xs ' + (Number(riga.fdRoma)===v ? 'border-amber-600 bg-amber-600 text-white' : 'border-amber-300 bg-white text-amber-900')}>
                          &euro; {v}
                        </button>
                      ))}
                      <input type="number" value={riga.fdRoma} onChange={e => aggiornaRiga(riga.id, { fdRoma: Number(e.target.value) })}
                        className="w-24 border border-amber-300 rounded-lg px-2 py-1 text-xs text-right bg-white" />
                      <button onClick={() => aggiornaRiga(riga.id, { fdRoma: 0 })} className="text-xs text-amber-700 underline">togli</button>
                    </div>
                  </div>
                )}

                {calc.busNecessari > 1 && (
                  <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 text-xs text-amber-800">
                    {riga.pax} passeggeri: capienza massima 63 posti, servono <strong>{calc.busNecessari} pullman</strong>. Prezzo per singolo mezzo.
                  </div>
                )}

                <div className="bg-slate-50 rounded-lg p-3 space-y-1.5">
                  {calc.forfait ? (
                    <p className="text-xs text-slate-500">Tariffa forfettaria: include gia autista, consumi e utile. Se riesci ad abbinarlo a un altro servizio, abbassa il prezzo qui sotto.</p>
                  ) : (
                    <React.Fragment>
                      <div className="flex justify-between text-xs text-slate-600"><span>Mezzo</span><span>{calc.mezzo}</span></div>
                      {calc.costi.map((c,i) => (
                        <div key={i} className="flex justify-between text-xs text-slate-600">
                          <span>{c.label}</span><span>&euro; {fmt(c.amount)}</span>
                        </div>
                      ))}
                      <div className="flex justify-between text-xs font-medium text-slate-800 pt-1 border-t border-slate-200">
                        <span>Costi</span><span>&euro; {fmt(calc.costoTotale)}</span>
                      </div>
                    </React.Fragment>
                  )}
                  <div className="flex items-center justify-between gap-3 pt-2">
                    <label className="text-xs text-slate-600">Prezzo riga</label>
                    <input type="number" value={prezzo} onChange={e => aggiornaRiga(riga.id, { prezzo: e.target.value })}
                      className="w-32 border border-slate-300 rounded-lg px-2 py-1.5 text-sm text-right font-medium" />
                  </div>
                  {!calc.forfait && (
                    <div className={'flex justify-between text-xs pt-1 ' + (utile < 200 ? 'text-red-600 font-medium' : 'text-green-700')}>
                      <span>Utile che ne esce</span>
                      <span>&euro; {fmt(utile)}{utile < 200 ? ' - basso' : ''}</span>
                    </div>
                  )}
                </div>
              </div>
            ))}

            <button onClick={aggiungiRiga}
              className="w-full py-3 rounded-xl border border-dashed border-slate-300 text-sm text-slate-600 hover:border-slate-500">
              + Aggiungi giorno / servizio
            </button>

            {/* NON INCLUDE */}
            <div className="bg-white rounded-xl border border-slate-200 p-5 space-y-4">
              <div>
                <label className="text-sm font-medium text-slate-700 block">ZTL, tasse e parcheggi</label>
                <p className="text-xs text-slate-500 mt-1">Finiscono nel "non include": non entrano mai nel totale. Scrivi le prime lettere della citta per trovarla. Premi Salva per aggiungerne di nuove.</p>
              </div>

              {rimborsiSuggeriti.length > 0 && (
                <div className="bg-blue-50 border border-blue-200 rounded-lg p-3 space-y-2">
                  <p className="text-xs text-blue-900 font-medium">Dedotto dal programma:</p>
                  <div className="flex flex-wrap gap-2">
                    {rimborsiSuggeriti.map(s => (
                      <button key={s.label} onClick={() => aggiungiExtra(s)}
                        className="px-2.5 py-1.5 rounded-lg border border-blue-300 bg-white text-xs text-blue-900 hover:border-blue-500">
                        + {s.label}{s.importo > 0 ? ' \u20AC' + s.importo : ''}
                      </button>
                    ))}
                  </div>
                  <p className="text-xs text-blue-600">{motivoRimborsi}</p>
                </div>
              )}

              {ztlSuggerite.length > 0 && (
                <div className="bg-indigo-50 border border-indigo-200 rounded-xl p-4 space-y-3">
                  <div className="flex items-start justify-between gap-3">
                    <p className="text-sm font-medium text-slate-900">Citta riconosciute nell'email</p>
                    <button onClick={() => setZtlSuggerite([])}
                      className="text-xs text-slate-500 hover:text-indigo-800 shrink-0">ignora</button>
                  </div>
                  <div className="space-y-3">
                    {ztlSuggerite.map((gruppo, gi) => (
                      <div key={gruppo.citta + gi} className="space-y-1.5">
                        {gruppo.ambigua && (
                          <p className="text-xs text-amber-700 flex items-center gap-1.5">
                            <span className="font-medium">{gruppo.citta}</span>
                            <span className="text-amber-700">&mdash; scegli tu la variante corretta</span>
                          </p>
                        )}
                        {gruppo.opzioni.map((z, i) => (
                          <button key={z.label + i}
                            onClick={() => { aggiungiExtra(z); setZtlSuggerite(prev => prev.filter(g => g.citta !== gruppo.citta)); }}
                            className="w-full flex items-center justify-between gap-3 bg-white border border-indigo-200 rounded-lg px-3 py-2 text-left hover:border-indigo-400 group">
                            <span className="min-w-0">
                              <span className="block text-sm text-slate-900 truncate">{z.label}</span>
                              {z.nota && <span className="block text-xs text-slate-400 truncate">{z.nota}</span>}
                            </span>
                            <span className="shrink-0 flex items-center gap-2">
                              {z.importo > 0
                                ? <span className="text-sm font-medium text-slate-900 tabular-nums">&euro; {z.importo}</span>
                                : <span className="text-xs text-amber-700">da verificare</span>}
                              <span className="text-blue-600 group-hover:text-blue-600 text-sm">+</span>
                            </span>
                          </button>
                        ))}
                      </div>
                    ))}
                  </div>
                  <p className="text-xs text-slate-600">Controlla giorni e tariffa: l'IA propone in base a quanto scritto nell'email.</p>
                </div>
              )}

              {/* RICERCA VOCI */}
              <div className="relative">
                <div className="flex items-center gap-2 border-2 border-slate-200 rounded-xl px-3 py-2.5 bg-white focus-within:border-slate-900 transition-colors">
                  <span className="text-slate-400 text-sm">&#128269;</span>
                  <input
                    value={ricerca}
                    onChange={e => { setRicerca(e.target.value); setRicercaAperta(true); }}
                    onFocus={() => setRicercaAperta(true)}
                    onBlur={() => setTimeout(() => setRicercaAperta(false), 180)}
                    placeholder="Cerca una citta o una voce: Assisi, Siena, pranzo autista..."
                    className="flex-1 text-sm outline-none bg-transparent" />
                  {ricerca && (
                    <button onMouseDown={e => { e.preventDefault(); setRicerca(''); }}
                      className="text-slate-400 hover:text-slate-700 text-sm px-1">&times;</button>
                  )}
                </div>

                {ricercaAperta && risultatiRicerca.length > 0 && (
                  <div className="absolute z-20 left-0 right-0 mt-1.5 bg-white border border-slate-200 rounded-xl shadow-lg max-h-72 overflow-y-auto">
                    {risultatiRicerca.map((e, i) => (
                      <button key={e.label + i}
                        onMouseDown={ev => { ev.preventDefault(); aggiungiExtra(e); setRicerca(''); }}
                        className="w-full text-left px-3.5 py-2.5 hover:bg-slate-50 border-b border-slate-100 last:border-0 flex items-start justify-between gap-3 group">
                        <span className="min-w-0">
                          <span className="block text-sm text-slate-900 group-hover:text-slate-900 truncate">{e.label}</span>
                          {e.nota && <span className="block text-xs text-slate-400 truncate">{e.nota}</span>}
                        </span>
                        <span className="shrink-0 text-right">
                          {e.importo > 0
                            ? <span className="text-sm font-medium text-slate-900 tabular-nums">&euro; {e.importo}{e.oraria ? <span className="text-xs font-normal text-slate-400">/h</span> : null}</span>
                            : <span className="text-xs text-slate-400">da definire</span>}
                        </span>
                      </button>
                    ))}
                  </div>
                )}

                {ricercaAperta && ricerca.trim() && risultatiRicerca.length === 0 && (
                  <div className="absolute z-20 left-0 right-0 mt-1.5 bg-white border border-slate-200 rounded-xl shadow-lg p-3">
                    <button onMouseDown={ev => { ev.preventDefault(); aggiungiExtra({ label: ricerca.trim(), importo: 0, nota: '' }); setRicerca(''); }}
                      className="w-full text-left text-sm text-slate-700 hover:text-slate-900">
                      Nessun risultato. <span className="underline">Aggiungi "{ricerca.trim()}" come voce nuova</span>
                    </button>
                  </div>
                )}
              </div>

              <button onClick={() => aggiungiExtra({ label:'', importo:0, nota:'' })}
                className="text-xs text-slate-500 hover:text-slate-900 underline">
                oppure aggiungi una voce vuota
              </button>

              {vociExtra.length > 0 && (
                <div className="space-y-2">
                  {vociExtra.map(v => (
                    <div key={v.id} className="border border-slate-200 rounded-xl p-3 bg-slate-50 space-y-2">
                      <div className="flex items-center gap-2">
                        <input value={v.label}
                          onChange={e => aggiornaExtra(v.id, { label: e.target.value })}
                          onBlur={e => completaExtra(v.id, e.target.value)}
                          placeholder="es. Assisi ZTL"
                          className="flex-1 min-w-0 bg-transparent text-sm font-medium text-slate-900 outline-none border-b border-transparent focus:border-slate-300 pb-0.5" />
                        {v.oraria && (
                          <div className="flex items-center gap-1 shrink-0 bg-white border border-blue-200 rounded-lg px-2 py-1">
                            <input type="number" value={v.ore} min="0" step="0.5"
                              onChange={e => aggiornaOre(v.id, e.target.value)}
                              className="w-12 text-sm text-right outline-none bg-transparent text-blue-900" />
                            <span className="text-xs text-blue-600">h</span>
                          </div>
                        )}
                        <div className="flex items-center gap-1 shrink-0 bg-white border border-slate-200 rounded-lg px-2 py-1">
                          <span className="text-sm text-slate-400">&euro;</span>
                          <input type="number" value={v.importo}
                            onChange={e => aggiornaExtra(v.id, { importo: e.target.value })}
                            className="w-20 text-sm text-right outline-none bg-transparent font-medium tabular-nums" />
                        </div>
                        <button onClick={() => salvaExtraInArchivio(v.id)}
                          disabled={!v.label.trim() || !Number(v.importo)}
                          title="Salva in archivio per riusarla"
                          className={'shrink-0 w-7 h-7 rounded-lg border text-xs flex items-center justify-center ' + (v.salvata ? 'border-green-300 text-green-700 bg-green-50' : 'border-slate-200 text-slate-400 hover:border-slate-400 hover:text-slate-700 disabled:opacity-30')}>
                          {v.salvata ? '\u2713' : '\u2b07'}
                        </button>
                        <button onClick={() => rimuoviExtra(v.id)} title="Rimuovi"
                          className="shrink-0 w-7 h-7 rounded-lg text-slate-300 hover:text-red-600 hover:bg-red-50 flex items-center justify-center">
                          &times;
                        </button>
                      </div>
                      <div className="flex items-center gap-2">
                        <input value={v.nota} onChange={e => aggiornaExtra(v.id, { nota: e.target.value })}
                          placeholder="nota (facoltativa)"
                          className="flex-1 bg-transparent text-xs text-slate-500 outline-none border-b border-transparent focus:border-slate-300 pb-0.5" />
                        {v.oraria && Number(v.ore) > 0 && (
                          <span className="text-xs text-blue-600 shrink-0">{v.ore}h &times; &euro;{v.tariffaOraria}/ora</span>
                        )}
                      </div>
                    </div>
                  ))}
                  {vociExtra.some(v => (v.nota || '').includes('DA RICHIEDERE')) && (
                    <div className="bg-red-50 border border-red-200 rounded-lg p-3 text-xs text-red-800">
                      Attenzione: una delle voci richiede l'autorizzazione preventiva del Comune. Ricordati di richiederla prima del viaggio.
                    </div>
                  )}
                </div>
              )}

              <div>
                <label className="text-xs text-slate-500 mb-1 block">Altre esclusioni (una per riga)</label>
                <textarea value={nonInclude} onChange={e => setNonInclude(e.target.value)} rows={3}
                  className="w-full border border-slate-200 rounded-[10px] px-3 py-2 text-sm" />
                <p className="text-xs text-slate-500 mt-1">L'IVA 10% viene aggiunta da sola in fondo.</p>
              </div>
            </div>
          </div>

          {/* COLONNA DESTRA */}
          <div className="lg:col-span-2">
            <div className="sticky top-6 space-y-4">
              <div className="bg-red-700 rounded-xl p-6 text-white">
                <p className="text-xs uppercase tracking-widest text-red-100 mb-1">Preventivo</p>
                <p className="text-sm text-white mb-4">{clienteNome || 'Cliente da indicare'}</p>

                <div className="space-y-2 mb-4">
                  {righeCalcolate.map(({ riga, prezzo }, i) => (
                    <div key={riga.id} className="flex justify-between gap-3 text-sm text-red-50">
                      <span className="truncate">{riga.data || riga.descrizione || ('Servizio ' + (i+1))}</span>
                      <span className="text-white font-medium">&euro; {fmt(prezzo)}</span>
                    </div>
                  ))}
                </div>

                <div className="pt-3 border-t border-white/20 flex items-end justify-between">
                  <span className="text-sm text-red-100">Totale{maxBus > 1 ? ' per bus' : ''}</span>
                  <span className="text-2xl font-serif text-white">&euro; {fmt(totale)}</span>
                </div>
                {maxBus > 1 && <p className="text-xs text-amber-300 mt-2 text-right">Servono {maxBus} pullman - moltiplicare x{maxBus}</p>}
                <p className="text-xs text-red-200 mt-1 text-right">+ IVA 10% e voci non incluse</p>

                <button onClick={() => setMostraDettaglio(!mostraDettaglio)}
                  className="w-full mt-4 pt-3 border-t border-white/20 flex items-center justify-between text-xs text-red-100 hover:text-white">
                  <span>Totale con tutto incluso</span>
                  <span className="text-white">&euro; {fmt(totaleConTutto)} {mostraDettaglio ? '\u25B2' : '\u25BC'}</span>
                </button>

                {mostraDettaglio && (
                  <div className="mt-3 space-y-1.5 bg-black/20 rounded-lg p-3">
                    <div className="flex justify-between text-xs text-red-100"><span>Servizi</span><span className="text-white font-medium">&euro; {fmt(totale)}</span></div>
                    <div className="flex justify-between text-xs text-red-100"><span>IVA 10%</span><span className="text-white font-medium">&euro; {fmt(iva)}</span></div>
                    {vociExtra.length > 0 && (
                      <div className="pt-2 mt-1 border-t border-white/20 space-y-1.5">
                        {vociExtra.map(v => (
                          <div key={v.id} className="flex justify-between gap-3 text-xs text-red-100">
                            <span className="truncate">{v.label || 'Voce senza nome'}</span>
                            <span className="text-white font-medium">&euro; {fmt(v.importo)}</span>
                          </div>
                        ))}
                      </div>
                    )}
                    <div className="flex justify-between text-sm font-medium text-white pt-2 mt-1 border-t border-white/20">
                      <span>Totale complessivo</span><span>&euro; {fmt(totaleConTutto)}</span>
                    </div>
                    {utileComplessivo > 0 && (
                      <div className="flex justify-between text-xs text-green-300 pt-2 mt-1 border-t border-white/20">
                        <span>Utile sui servizi a km</span><span className="font-medium">&euro; {fmt(utileComplessivo)}</span>
                      </div>
                    )}
                  </div>
                )}
              </div>

              <button onClick={salvaPreventivo}
                className="w-full py-3 rounded-xl bg-red-600 text-white text-sm font-medium hover:bg-red-700">
                {idCorrente ? 'Aggiorna preventivo' : 'Segna come inviato'}
              </button>

              {salvataggioMsg && (
                <p className="text-xs text-center text-green-700">{salvataggioMsg}</p>
              )}

              {idCorrente && (
                <button onClick={nuovoPreventivo}
                  className="w-full py-2 text-xs text-slate-500 hover:text-slate-900 underline">
                  Inizia un preventivo nuovo
                </button>
              )}

              <button onClick={copiaTesto}
                className={'w-full py-3 rounded-xl border text-sm font-medium ' +
                  (copiato === 'ok' ? 'bg-green-600 border-green-600 text-white'
                   : copiato === 'errore' ? 'bg-red-50 border-red-300 text-red-700'
                   : 'bg-white border-slate-300 text-slate-900 hover:border-slate-500')}>
                {copiato === 'ok' ? 'Copiato' : copiato === 'errore' ? 'Copia non riuscita - selezionalo sotto' : 'Copia testo email'}
              </button>

              <div className="bg-white border border-slate-200 rounded-xl p-4">
                <div className="flex items-center justify-between mb-2">
                  <p className="text-xs font-medium text-slate-600">Anteprima email</p>
                  <button onClick={() => {
                      const el = document.getElementById('anteprima-testo');
                      if (!el) return;
                      el.focus(); el.select();
                    }}
                    className="text-xs text-blue-600 hover:text-blue-800 underline">
                    Seleziona tutto
                  </button>
                </div>
                <textarea id="anteprima-testo" readOnly value={generaTesto()} rows={16}
                  className="w-full text-xs leading-relaxed text-slate-700 border border-slate-200 rounded-lg p-2 bg-slate-50 resize-y" />
                <p className="text-xs text-slate-500 mt-2">Se il pulsante non funziona: premi "Seleziona tutto" e poi Ctrl+C.</p>
              </div>
            </div>
          </div>
        </div>
        </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
</body>
</html>
